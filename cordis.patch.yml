# Works with no configuration. Without APIFY_TOKEN the row falls back to
# Apify's anonymous tool set, which can discover Actors and read docs but
# cannot run anything. Set APIFY_TOKEN and restart the profile to unlock
# Actor runs and dataset reads:
#   https://console.apify.com/settings/integrations?utm_source=deepseek-harness&utm_medium=integrations
- insert:
    - id: apify-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: apify
        transport: streamable-http
        # Anonymous access only works with a restricted tool set; the default
        # endpoint requires a token.
        url: !!js 'process.env.APIFY_TOKEN ? "https://mcp.apify.com/?client=deepseek-harness+plugin" : "https://mcp.apify.com/?client=deepseek-harness+plugin&tools=search-actors,fetch-actor-details,search-apify-docs,fetch-apify-docs"'
        # Attached only when set, so an unset variable falls back to the
        # anonymous tier instead of sending `Bearer undefined` and 401ing.
        headers: !!js 'process.env.APIFY_TOKEN ? { Authorization: "Bearer " + process.env.APIFY_TOKEN } : {}'
        # dsh defaults to 60000; Apify Actor runs routinely take longer.
        toolCallTimeoutMs: 300000
        # Fail on bad token or unreachable server; missing token is handled above.
        failOnStartupError: true

    # Points at a module in THIS package so the skills directory resolves
    # against the package, not the user's cwd.
    - id: apify-skills
      name: 'dsh-apify-plugin/mount-skills'
