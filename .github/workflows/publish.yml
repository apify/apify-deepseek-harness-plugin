# npm's trusted publisher configuration for `dsh-apify-plugin` matches on this filename, so the
# `npm publish` step has to stay in this file. See RELEASING.md.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '`patch`, `minor`, `major`, or an exact version such as `0.2.0`.'
        required: true
        default: patch
        type: string

concurrency:
  # A release must not be cancelled halfway through, so a second run queues instead.
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Trusted publishing (OIDC) and provenance.

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Refuse to release from another branch or repository
        if: ${{ github.ref_name != github.event.repository.default_branch || github.repository != 'apify/apify-deepseek-harness-plugin' }}
        run: |
          echo "::error::Releases must be dispatched from ${{ github.event.repository.default_branch }} in apify/apify-deepseek-harness-plugin."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # No install step: the bundle has no dependencies and no build. That is
      # deliberate - an install-time build would put pnpm's allowBuilds prompt
      # between the user and a working plugin.
      - name: Verify bundle
        run: npm run verify

      # The input reaches the shell through the environment, never through ${{ }}
      # interpolation, so a crafted value cannot be executed.
      - name: Set the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^(patch|minor|major|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::version must be patch, minor, major, or X.Y.Z, got '$INPUT_VERSION'."
            exit 1
          fi
          npm version "$INPUT_VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      # Publishing before committing keeps a failed run safe to re-run: nothing has been written
      # yet, and a re-run that finds the version on npm skips straight to the commit and release.
      - name: Publish to npm
        run: |
          if npm view "dsh-apify-plugin@$VERSION" version > /dev/null 2>&1; then
            echo "dsh-apify-plugin@$VERSION is already on npm. Skipping publish."
          else
            npm publish --provenance --access public
          fi

      # The pull makes a re-run find the bump already on main and skip the commit.
      - name: Commit the version
        id: commit
        uses: apify/actions/signed-commit@v1.6.2
        with:
          message: 'chore(release): v${{ env.VERSION }} [skip ci]'
          add: package.json
          pull: '--rebase --autostash'
          github-token: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.APIFY_SERVICE_ACCOUNT_GITHUB_TOKEN }}
          TARGET: ${{ steps.commit.outputs.commit_long_sha }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists. Skipping."
            exit 0
          fi
          # npm pack fails with ENOENT when the destination does not exist.
          mkdir -p dist
          npm pack --pack-destination dist
          gh release create "v$VERSION" dist/*.tgz --target "$TARGET" --title "v$VERSION" --generate-notes
